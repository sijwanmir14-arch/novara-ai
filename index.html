
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVARA AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090b12;color:#f5f5f7;
 font-family:Arial,sans-serif;height:100dvh;
 display:flex;flex-direction:column;
}
header{
 height:65px;display:flex;align-items:center;
 justify-content:space-between;padding:0 17px;
 border-bottom:1px solid #242735;background:#10121b;
}
.logo{font-size:21px;font-weight:800;letter-spacing:2px}
.logo span{color:#9c7cff}
button{cursor:pointer;border:0;color:white}
.new{
 background:#29233d;border:1px solid #514078;
 padding:10px 13px;border-radius:10px;
}
main{
 flex:1;overflow-y:auto;width:100%;
 max-width:850px;margin:auto;padding:22px 16px;
}
.welcome{text-align:center;margin:16vh auto 30px}
.welcome h1{font-size:35px;margin:0 0 12px}
.welcome h1 span{color:#a88aff}
.welcome p{color:#a5a8b7;line-height:1.6}
.message{
 padding:15px 17px;border-radius:17px;
 margin:14px 0;line-height:1.65;
 white-space:pre-wrap;overflow-wrap:anywhere;
}
.user{
 background:#28243a;margin-left:12%;
 border:1px solid #42395b;
}
.ai{background:#141824;margin-right:5%}
.label{font-size:11px;color:#aa91ff;margin-bottom:7px}
#typing{color:#a99acb;font-size:13px;padding:8px}
footer{
 padding:12px 14px 18px;
 background:#090b12;border-top:1px solid #242735;
}
form{
 max-width:820px;margin:auto;display:flex;gap:9px;
 align-items:flex-end;background:#171a25;
 border:1px solid #373b4c;border-radius:17px;padding:9px;
}
textarea{
 flex:1;resize:none;max-height:130px;min-height:42px;
 border:0;outline:0;background:transparent;color:white;
 font-size:16px;padding:11px 5px;font-family:inherit;
}
#send{
 width:44px;height:44px;border-radius:13px;
 background:#8865ed;font-size:20px;font-weight:bold;
}
#send:disabled{opacity:.45}
.hint{text-align:center;color:#74798b;font-size:11px;margin-top:10px}
#status{max-width:820px;margin:0 auto 8px;color:#ffaaaa;font-size:13px}
@media(max-width:500px){
 .welcome h1{font-size:29px}
 main{padding:15px 12px}
 .user{margin-left:5%}
}
</style>
</head>
<body>

<header>
 <div class="logo">NOVARA <span>AI</span></div>
 <button class="new" id="newChat">+ New Chat</button>
</header>

<main id="chat">
 <div class="welcome" id="welcome">
  <h1>Welcome to <span>NOVARA AI</span></h1>
  <p>Your intelligent AI assistant.<br>Ask anything. Learn anything.</p>
 </div>
</main>

<footer>
 <div id="status"></div>
 <form id="chatForm">
  <textarea id="message" placeholder="Message NOVARA AI..." rows="1"></textarea>
  <button id="send" type="submit">↑</button>
 </form>
 <div class="hint">NOVARA AI can make mistakes. Check important information.</div>
</footer>

<script>
const API_URL = "https://novara-ai-api.sijumir14.workers.dev/chat";

const chat = document.getElementById("chat");
const form = document.getElementById("chatForm");
const input = document.getElementById("message");
const send = document.getElementById("send");
const statusBox = document.getElementById("status");
const welcome = document.getElementById("welcome");

let messages = [];
let busy = false;

function addMessage(role, content) {
  if (welcome) welcome.style.display = "none";

  const div = document.createElement("div");
  div.className = "message " + (role === "user" ? "user" : "ai");

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = role === "user" ? "YOU" : "NOVARA AI";

  const text = document.createElement("div");
  text.textContent = content;

  div.appendChild(label);
  div.appendChild(text);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage(event) {
  event.preventDefault();

  const text = input.value.trim();

  if (!text || busy) return;

  busy = true;
  send.disabled = true;
  statusBox.textContent = "";

  if (welcome) welcome.style.display = "none";

  addMessage("user", text);
  messages.push({role:"user", content:text});

  input.value = "";
  input.style.height = "42px";

  const typing = document.createElement("div");
  typing.id = "typing";
  typing.textContent = "NOVARA AI is thinking...";
  chat.appendChild(typing);

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({messages: messages})
    });

    const data = await response.json();

    if (!response.ok || data.success === false) {
      throw new Error(data.error || "Server error: " + response.status);
    }

    const reply = data.reply || data.response || data.output;

    if (!reply) {
      throw new Error("AI returned an empty reply.");
    }

    messages.push({role:"assistant", content:reply});
    addMessage("assistant", reply);

    try {
      localStorage.setItem("novara_history", JSON.stringify(messages));
    } catch(e) {}

  } catch(error) {
    statusBox.textContent = "Error: " + error.message;
    addMessage("assistant", "Sorry! Connection problem. Please try again.");
    messages.pop();
  } finally {
    const loader = document.getElementById("typing");
    if (loader) loader.remove();

    busy = false;
    send.disabled = false;
    input.focus();
  }
}

form.addEventListener("submit", sendMessage);

input.addEventListener("input", () => {
  input.style.height = "42px";
  input.style.height = Math.min(input.scrollHeight, 130) + "px";
});

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});

document.getElementById("newChat").addEventListener("click", () => {
  messages = [];
  chat.innerHTML = "";
  if (welcome) {
    welcome.style.display = "block";
    chat.appendChild(welcome);
  }
  statusBox.textContent = "";
  try { localStorage.removeItem("novara_history"); } catch(e) {}
});

try {
  const saved = JSON.parse(localStorage.getItem("novara_history") || "[]");
  if (Array.isArray(saved) && saved.length) {
    messages = saved;
    messages.forEach(m => addMessage(m.role, m.content));
  }
} catch(e) {}
</script>
</body>
  </html>
